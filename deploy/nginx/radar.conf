# nginx delante de la web: pasa cada petición al contenedor en servicio (radar o radar-b). El
# relevo lo hace deploy/actualizar.sh escribiendo data/proxy/activo.conf y recargando nginx, que
# termina las peticiones en curso con la configuración anterior: no se corta ninguna.

# Para que el relevo compruebe quién atiende: sólo si la petición lo pide.
map $http_x_radar_relevo $radar_comprobacion {
    default "";
    "1" $radar_activo;
}

server {
    listen 8080;
    server_tokens off;

    # Los nombres de los contenedores se resuelven en cada petición con el DNS de Docker: así nginx
    # arranca y recarga aunque el otro contenedor esté parado.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $radar_activo radar;
    include /etc/nginx/activo/*.conf;

    add_header X-Radar-Activo $radar_comprobacion always;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://$radar_activo:8080;
        error_page 502 503 504 =503 @actualizando;
    }

    # El directo antiguo (SSE) va abierto mucho rato y sin acumular la respuesta.
    location = /api/stream {
        proxy_pass http://$radar_activo:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
        error_page 502 503 504 =503 @actualizando;
    }

    # Ningún contenedor responde: la API dice que se está actualizando (la web lo enseña y
    # reintenta) y las páginas muestran actualizando.html, que se recarga sola.
    location @actualizando {
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always;
        default_type application/json;
        if ($uri ~ ^/api/) {
            return 503 '{"error":"actualizando","reintentarEn":15}';
        }
        root /usr/share/nginx/html;
        rewrite ^ /actualizando.html break;
    }
}
