# Pasa los tests y comprueba la sintaxis en cada push. GitHub avisa por email si falla, antes de
# que llegue a produccion (el VPS también los pasa al construir la imagen y no despliega si fallan).
# En dev los pasa el primer paso de pipeline.yml.
name: tests

on:
  push:
    branches-ignore: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sintaxis del navegador y de los scripts de despliegue
        run: |
          for f in public/js/*.js; do node --check "$f"; done
          for f in deploy/*.sh; do bash -n "$f"; done
          node --check deploy/comprobar.mjs
